spring:
  datasource:
    url: jdbc:h2:mem:vision;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: localhost
      port: 16379

app:
  seed: false
  jwt:
    secret: Y291bnR5LXZpc2lvbi1jYXJlLXNlY3JldC1rZXktMjAyNi1sb25nLWVub3VnaA==
    expire-hours: 12
