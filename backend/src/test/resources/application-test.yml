spring:
  datasource:
    url: jdbc:h2:mem:visiontest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

vision:
  redis:
    enabled: false
  seed:
    enabled: false
