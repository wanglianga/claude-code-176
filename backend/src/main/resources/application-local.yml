# 本地开发/验证 profile：零外部依赖（H2 内存库 + Redis 降级为进程内缓存）
spring:
  datasource:
    url: jdbc:h2:mem:visiondb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

vision:
  redis:
    enabled: false
  seed:
    enabled: true
