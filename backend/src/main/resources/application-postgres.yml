# Docker/生产 profile：PostgreSQL + Redis
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:vision}
    username: ${DB_USER:vision}
    password: ${DB_PASSWORD:vision123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 1500ms

vision:
  redis:
    enabled: true
  seed:
    enabled: ${VISION_SEED_ENABLED:true}
