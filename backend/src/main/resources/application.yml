server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: county-vision-care
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vision}
    username: ${DB_USER:vision}
    password: ${DB_PASSWORD:vision}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:Y291bnR5LXZpc2lvbi1jYXJlLXNlY3JldC1rZXktMjAyNi1sb25nLWVub3VnaA==}
    expire-hours: 12

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.county.vision: INFO
